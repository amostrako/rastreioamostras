<!-- overlay detalhes -->
<div id="overlayDetalhes" class="overlay oculto">
    <div class="painel-detalhes">
        <button class="fechar" onclick="fecharDetalhes()">✕</button>
        <div id="conteudoDetalhes"></div>
    </div>
</div>

<!-- notificações -->
<div id="overlayNotificacoes" class="overlay oculto">
    <div class="painel-detalhes">
        <button class="fechar" onclick="fecharNotificacoes()">✕</button>
        <h3>Pedidos Pendentes</h3>
        <div id="listaNotificacoes"></div>
    </div>
</div>

<!-- topo -->
<header class="topbar" id="boxFiltros">

    <button class="btn-menu" onclick="toggleMenu()">☰</button>
        
    <div class="logo-topo">
        <img id="logoMarcaBox" class="logo-marca-box">
    </div>

    <div class="acoes-topo">
        <div id="boasVindas" class="usuario-topo"></div>

        <button id="btnNotificacoes" class="icone-topo oculto" title="Notificações">
            🔔 <span id="contadorNotificacoes" class="badge"></span>
        </button>

       
    </div>

    <!-- 🔥 FILTRO CORRIGIDO -->
    <div class="filtros-topo">
        <div class="campo-busca-wrapper">

            <!-- botão tipo -->
            <button id="btnTipoBusca" class="btn-tipo-busca">
                <strong id="labelTipoBusca">Nota Fiscal</strong>
            </button>

            <!-- menu -->
            <div id="menuTipoBusca" class="menu-tipo-busca oculto">
                <div class="menu-item" data-tipo="nota">📄 Nota Fiscal</div>
                <div class="menu-item" data-tipo="pedido">🛒 Pedido</div>
                <div class="menu-item" data-tipo="cliente">👤 Cliente</div>
                <div class="menu-item" data-tipo="representante">👤 Representante</div>
            </div>

            <!-- input -->
            <input
                id="filtroBusca"
                type="text"
                placeholder="Buscar por Nota Fiscal"
            />

        </div>
    </div>

</header>

<!-- dashboard -->
<div class="dashboard-cards">

  <div class="card-status total" data-status="TOTAL">
    <div class="card-top">
      <span class="card-valor" id="totalGeral">0</span>
      <span class="card-icone">📈</span>
    </div>
    <div class="card-label">Todos Envios</div>
  </div>

  <div class="card-status entregue" data-status="ENTREGUE">
    <div class="card-top">
      <span class="card-valor" id="totalEntregues">0</span>
      <span class="card-icone">✅</span>
    </div>
    <div class="card-label">Entregues</div>
  </div>

  <div class="card-status pendente" data-status="PENDENTE">
    <div class="card-top">
      <span class="card-valor" id="totalPendentes">0</span>
      <span class="card-icone">⏳</span>
    </div>
    <div class="card-label">Pendentes</div>
  </div>

  <div class="card-status retornou" data-status="RETORN">
    <div class="card-top">
      <span class="card-valor" id="totalRetornados">0</span>
      <span class="card-icone">↩</span>
    </div>
    <div class="card-label">Retornados</div>
  </div>

</div>

<!-- resultado -->
<section id="resultado" class="lista-cards"></section>

<!-- scripts -->
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>

</body>
</html>
